[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-locator"
version = "0.4.0"
description = "Sustainable AI data-center county locator for Virginia and Georgia (eight dimensions)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dc_locator*"]
